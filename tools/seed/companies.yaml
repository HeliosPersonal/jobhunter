# JobHunter curated company registry (F1 T03, ADR-F1-0001).
#
# One entry per hiring organisation. This is the trusted seed: every entry carries a known ATS binding,
# so `seed` creates the company active with a confident binding and local discovery produces jobs on the
# first run. Provenance is `Curated` for every row here — the weekly directory crawl proposes companies
# inactive under `DirectoryCrawl` instead.
#
# Schema (validated by CompanySeedLoader, which fails naming the offending line):
#   domain:        required, canonicalisable registrable domain (natural key, unique)
#   display_name:  required
#   ats_kind:      required, one of Greenhouse | Lever | Ashby | Workable | CareersPage
#   board_token:   required, the provider's board slug (or full careers URL for CareersPage)
#   careers_url:   optional detection hint
#   hq_country:    optional ISO-3166-1 alpha-2
#
# Curation (which companies belong here) is deliberately out of scope of the code: add, remove or correct
# a row and re-run `seed` — it is idempotent and reports zero inserts when nothing changed.

