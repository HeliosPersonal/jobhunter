# Technology vocabulary (F2 T07) — the curated set matched against a job's title and description to
# populate `job_technologies` deterministically. Each entry is a canonical name (the spelling written to
# the database) and its accepted aliases (all mapped onto that canonical name). Matching is whole-token,
# case-insensitive; it never matches inside a longer token, so a two-letter name cannot hit inside a word.
#
# Reviewable in a diff on purpose: adding a technology or an alias is a one-line change here, never a code
# change. Keep the list alphabetical within each section and keep aliases lower-risk than the canonical —
# an over-broad alias ("react" for "React Native") would over-tag, so only add spellings that are safe as
# whole tokens.

