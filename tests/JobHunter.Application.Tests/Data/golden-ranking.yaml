# ---- The ten difficult cases the golden set exists to pin (test-plan §The golden ranking set) --------

- id: 36
  band: reject
  suppressed_by: rank:threshold
  hard_case: perfect-stack-wrong-seniority
  why: >-
    Perfect stack, wrong seniority. A one-rung-junior Mid role clears the factual floor (the filter only
    catches two rungs down), so it reaches the deep tier — which rejects it on the seniority mismatch the
    filter cannot see. An anti-goal enterprise-CRUD classification gives it zero alignment; rejected, and
    below the threshold, so suppressed.
  model_score: 20
  ai_usage: None
  role_family: EnterpriseCrud
  seniority: Mid
  employment_type: FullTime
  age_days: 0
  enrichment: { band: EMEA, is_remote: true }

