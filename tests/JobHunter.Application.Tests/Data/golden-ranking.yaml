  employment_type: FullTime
  age_days: 0
  enrichment: { band: APAC, is_remote: false }

- id: 40
  band: good
  hard_case: ideal-role-salary-below-floor
  why: >-
    An ideal role whose estimated pay is below the floor, but at low confidence (0.50) — not certain
    enough for the factual filter to bite, and the floor is a down-weight not a filter by default, so it
    is shown as good rather than suppressed.
  model_score: 60
