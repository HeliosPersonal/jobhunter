# The golden ranking set (F4 T11, test-plan §The golden ranking set, gate G10 / QG-1 / QG-3).
#
# 50 jobs judged against one fixed CV/Owner — EMEA, Senior, a 100000 USD salary floor, seeking FullTime
# and Contract — by the REAL, pure ranking chain with no LLM in the loop: PreMatchFilter (the factual
# gate, T12) then AlignmentCalculator + ScoreCalculator + SuppressionEvaluator (the career-alignment
# component, the linear scorer and the presentation rules, T07/T08/T14). Each case records the deep tier's
# fit judgement (`model_score`) and the enrichment's recorded classifications (`ai_usage`, `role_family`)
# — the numbers/labels the batch would have returned — plus the job's facts, and states the band the whole
# chain must reconcile to.
#
# The assertions are on BANDS and RELATIVE ORDER, never exact scores — the model is not deterministic and
# a test pretending otherwise is a flaky test that gets disabled within a month. The bands (final score):
#   excellent >= 75 · good 55-75 · marginal 40-55 · reject < 40
# A `reject` job is below the 40-point presentation threshold, so it is also suppressed with a threshold
# reason; a `na` band is a job the factual filter excluded before scoring, labelled with the rule.
#
# T14 reweight (stated reason, gate G10): the scorer moved from (0.60 match, 0.25 preference, 0.15
# freshness) to (0.45 match, 0.20 ALIGNMENT, 0.20 preference, 0.15 freshness). With no preference model the
# preference weight renormalises away, so the effective weights are now 0.5625 match, 0.25 alignment,
# 0.1875 freshness (they were 0.80 match, 0.20 freshness). Career alignment now carries a quarter of the
# effective score, so every case records the ai_usage/role_family that produces its alignment, and the
# whole set was recalibrated in this PR — see the T14 task doc.
#
# This file IS gate G10: a change to the match prompt, the schema or the ranking weights that moves a case
# out of its band, or reorders the top five, fails the build — or is updated here in the same PR with a
# stated reason (test-plan §The golden ranking set).
#
# Case fields:
#   band          — excellent | good | marginal | reject | na  (na = excluded by the pre-match filter)
#   suppressed_by — omitted when shown; else prematch:<rule> or rank:threshold (the reason that must fire)
#   top5_rank     — for the five highest-scoring jobs only, their expected relative order (1 = highest)
#   hard_case     — the test-plan §The golden ranking set row this case pins, when it is one of the ten
#   model_score   — the deep tier's recorded 0-100 fit judgement, the scorer's match input
#   ai_usage      — the enrichment's recorded AI-usage level (None|Low|Medium|High); an alignment input (T14)
#   role_family   — the enrichment's recorded role family; an alignment input (T14). Omitted => Other
#   seniority     — the posting's level string (omitted for an untitled posting)
#   employment_type — the posting's engagement string
#   age_days      — days since first seen, for the freshness component (0 = just seen)
#   enrichment    — omitted for an unenriched job (confidence 0.85 applied); else band / is_remote / salary

