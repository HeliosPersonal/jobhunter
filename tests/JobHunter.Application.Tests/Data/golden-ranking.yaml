  model_score: 70
  seniority: Senior
  employment_type: Contract
  age_days: 0
  enrichment: { band: EMEA, is_remote: true }

- id: 42
  band: na
  suppressed_by: prematch:employment_type
  hard_case: contract-role-owner-not-open
  why: >-
    An engagement the Owner does not seek — suppressed with an employment-type reason. Represented as a
    PartTime role, since this fixed Owner is open to contract; the rule under test is the same: a
    recognised, unsought engagement is a factual exclusion.
  model_score: 70
  seniority: Senior
  employment_type: PartTime
  age_days: 0
  enrichment: { band: EMEA, is_remote: true }

- id: 43
  band: excellent
  hard_case: excellent-fit-aged-still-top-ten
  why: >-
    An excellent fit posted 20 days ago. Freshness must not bury fit: it stays excellent and inside the
    top ten, below only the fresh strong head.
  model_score: 95
  seniority: Senior
  employment_type: FullTime
  age_days: 20
  enrichment: { band: EMEA, is_remote: true }

- id: 44
  band: marginal
  hard_case: vague-posting
  why: >-
    A vague posting with almost no detail — the deep tier scores it marginal. (The reason naming the
    vagueness lives on the match record, which the ranking arithmetic trusts rather than re-derives.)
  model_score: 30
  seniority: Senior
  employment_type: FullTime
  age_days: 0
  enrichment: { band: EMEA, is_remote: true }

- id: 45
  band: good
  hard_case: no-enrichment-confidence-multiplier
  why: >-
    No enrichment available — matched all the same, with the 0.85 confidence multiplier applied, which
    drops a would-be-excellent 80-fit into the good band. Uncertainty lowers a score, never excludes.
  model_score: 80
  seniority: Senior
  employment_type: FullTime
  age_days: 0

