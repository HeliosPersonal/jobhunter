# ---- The ten difficult cases the golden set exists to pin (test-plan §The golden ranking set) --------

- id: 36
  band: reject
  suppressed_by: rank:threshold
  hard_case: perfect-stack-wrong-seniority
  why: >-
    Perfect stack, wrong seniority. A one-rung-junior Mid role clears the factual floor (the filter only
    catches two rungs down), so it reaches the deep tier — which rejects it on the seniority mismatch the
    filter cannot see. Rejected, and below the threshold, so suppressed.
  model_score: 20
  seniority: Mid
  employment_type: FullTime
  age_days: 0
  enrichment: { band: EMEA, is_remote: true }

- id: 37
  band: good
  hard_case: perfect-stack-stretch-seniority
  why: Perfect stack, one level up. A stretch is worth an application, so it lands good, not rejected.
  model_score: 60
  seniority: Staff
  employment_type: FullTime
  age_days: 0
  enrichment: { band: EMEA, is_remote: true }

- id: 38
  band: marginal
  hard_case: adjacent-stack-same-domain
  why: Adjacent stack (Java rather than .NET), same domain — a marginal fit, not a good one.
  model_score: 38
  seniority: Senior
  employment_type: FullTime
  age_days: 0
  enrichment: { band: EMEA, is_remote: true }

- id: 39
  band: na
  suppressed_by: prematch:timezone
  hard_case: ideal-role-wrong-timezone
