  parses: true
  remote: true
  contractor: false
  aiUsageIn: [High]
  timezoneIn: [EMEA]
  stageIn: [SeriesB]
  roleFamilyIn: [AiPlatform]
  buildsAiInfra: true
  buildsAiProduct: false
  salary: present
