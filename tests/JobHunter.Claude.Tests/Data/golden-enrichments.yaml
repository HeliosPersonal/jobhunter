# F3 golden set — 62 recorded enrichment tool-use payloads driven through the REAL
# EnrichmentResultParser (GoldenEnrichmentSetTests). Each case asserts a labelled BAND, not an exact
# value, so a non-deterministic model does not make the suite flaky: the recorded payload is fixed, but
# the assertion tolerates the drift a live model would show, and the nightly live-drift job reuses these
# same bands against fresh model output. The corpus spans every enum value, salary present/absent, the
# five tolerant repairs (swap, clamp, unknown-currency drop, degraded enum, absent salary) and the hard
# rejections (empty reasons, malformed JSON, missing/wrong-typed required fields, negative amount).
#
# Keys: id, why (label), raw (the tool-use input JSON), parses (bool). For parses:true — remote,
# contractor, aiUsageIn, timezoneIn, stageIn, roleFamilyIn, buildsAiProduct, buildsAiInfra, usesAiTooling,
# isResearch, salary (present|absent), salaryFloor, salaryCeil, currency, minReasons, minTech, maxTech are
# optional band assertions. For parses:false — fail is a substring the recorded failure reason must contain.

# ---------------------------------------------------------------------------------------------------
# Clean cases: one per meaningful enum combination, salaries present and absent.
# ---------------------------------------------------------------------------------------------------
