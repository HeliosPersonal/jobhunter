  # --- Token differs from the domain: hyphen-collapsed and careers-URL derivation ---
  - domain: acme-labs.com
    boards: [{ provider: greenhouse, token: acmelabs, applyMatches: true }]
    expect: greenhouse
  - domain: foo-bar.io
    boards: [{ provider: lever, token: foobar, applyMatches: true }]
    expect: lever
  - domain: bigco.com
    careersUrl: https://jobs.ashbyhq.com/bigco-inc
    boards: [{ provider: ashby, token: bigco-inc, applyMatches: true }]
    expect: ashby

  # --- No board reachable: the correct answer is to bind nothing ---
  - domain: darkmatter-holdings.com
    boards: []
