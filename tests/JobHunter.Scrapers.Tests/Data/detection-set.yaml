  # --- Two providers both answer for the same slug: ambiguous, stays inactive ---
  - domain: dualstack.io
    boards:
      - { provider: greenhouse, token: dualstack, applyMatches: true }
      - { provider: lever, token: dualstack, applyMatches: true }
    expect: ambiguous
