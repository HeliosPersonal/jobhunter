# The labelled detection corpus (T08, AC-03/AC-04). Fifty companies with a known board (or none),
# each replayed as a zero-network probe: the router answers the ATS the company actually uses and 404s
# everything else. Accuracy must stay >= 47/50 — the detector's job is to bind the right board or bind
# nothing, never to attribute another company's jobs. `token` is the board slug the provider answers to;
# where it differs from the domain label the case exercises the careers-URL / hyphen token derivation.
companies:
  # --- Greenhouse, exact domain-derived token, apply URL points home (score 0.90) ---
  - domain: stripe.com
    boards: [{ provider: greenhouse, token: stripe, applyMatches: true }]
    expect: greenhouse
  - domain: gitlab.com
    boards: [{ provider: greenhouse, token: gitlab, applyMatches: true }]
    expect: greenhouse
