apiVersion: v1
kind: Secret
metadata:
  name: infisical-credentials
type: Opaque
# Placeholders only. CI substitutes them with `sed` from GitHub secrets at deploy time
# (ci-cd §2, "Substitute placeholders"); real values never live in the repo or image layers
# (invariant 12). These three bootstrap the Infisical fetch; every application secret comes from
# Infisical at pod startup, not from here.
stringData:
  INFISICAL_CLIENT_ID: INFISICAL_CLIENT_ID_PLACEHOLDER
  INFISICAL_CLIENT_SECRET: INFISICAL_CLIENT_SECRET_PLACEHOLDER
  INFISICAL_PROJECT_ID: INFISICAL_PROJECT_ID_PLACEHOLDER
